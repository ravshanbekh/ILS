# =============================================================================
#  ⚠️  ESKIRGAN — ISHLATILMAYDI
#
#  Bu fayl /etc/nginx/sites-available/itlivescore ga mo'ljallangan edi, lekin
#  o'sha yo'l sites-enabled ga ULANMAGAN — nginx uni hech qachon o'qimaydi.
#  Natijada bu yerdagi rate limiting kunlar davomida ishlamay turgan.
#
#  HAQIQIY fayl: nginx-itlivescore.conf  →  /etc/nginx/conf.d/itlivescore.conf
#  O'zgartirish kerak bo'lsa O'SHANI tahrirlang, bu faylni emas.
# =============================================================================

# =============================================================
#  SERVER NGINX KONFIGURATSIYASI — itlivescore.uz
#  Fayl: /etc/nginx/sites-available/itlivescore
#
#  O'rnatish:
#    sudo nano /etc/nginx/sites-available/itlivescore
#    (quyidagi konfiguratsiyani joylashtirish)
#    sudo ln -s /etc/nginx/sites-available/itlivescore /etc/nginx/sites-enabled/
#    sudo nginx -t
#    sudo systemctl reload nginx
#
#  SSL (Certbot):
#    sudo certbot --nginx -d itlivescore.uz -d www.itlivescore.uz -d demo.itlivescore.uz
# =============================================================

# =============================================================
#  DDoS / FLOOD HIMOYASI (rate limiting zonalari)
#  Bu direktivalar http kontekstida bo'lishi shart. sites-enabled fayllari
#  nginx.conf ning http {} bloki ichiga include qilingani uchun, ular
#  server {} dan TASHQARIDA, fayl boshida turadi.
#
#  DIQQAT: bu faqat bitta IP bo'yicha cheklaydi. Tarqoq (distributed) DDoS —
#  minglab IP dan — buni chetlab o'tadi; unga qarshi Cloudflare (bepul) kabi
#  old qatlam kerak. Batafsil: TUZATISH_REJASI / kundalik.
# =============================================================

# =============================================================
#  CLOUDFLARE — HAQIQIY MEHMON IP SINI TIKLASH
#
#  NEGA SHART: quyidagi barcha cheklovlar $remote_addr (mehmon IP si) ga
#  tayanadi. Cloudflare old qatlamga qo'yilganda $remote_addr Cloudflare'ning
#  IP siga aylanadi — ya'ni BUTUN MARKAZ bir nechta IP dek ko'rinadi va
#  hammaga bitta 20r/s chegara tegadi. Natijada halol o'quvchilar ham 429
#  xatosini oladi va sayt ishlamay qoladi.
#
#  Quyidagi sozlama CF-Connecting-IP sarlavhasidan haqiqiy IP ni oladi va
#  $remote_addr ni tiklaydi. Cloudflare ulanmagan bo'lsa — hech narsa
#  o'zgarmaydi (bu IP lardan trafik kelmaydi), shuning uchun oldindan
#  qo'yib qo'yish xavfsiz.
#
#  IP ro'yxati o'zgarishi mumkin. Yangilash:
#    curl https://www.cloudflare.com/ips-v4
#    curl https://www.cloudflare.com/ips-v6
# =============================================================
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Umumiy sayt trafigi: IP boshiga sekundiga 30 so'rov
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
# API: IP boshiga sekundiga 20 so'rov
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# Login/auth: qimmat (bcrypt) — IP boshiga daqiqasiga 10 so'rov
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Bir IP dan bir vaqtda ochilgan ulanishlar soni
limit_conn_zone $binary_remote_addr zone=conn:10m;

# Limitga urilganda 429 qaytariladi (standart 503 emas)
limit_req_status 429;
limit_conn_status 429;

# ============ ASOSIY TIZIM — itlivescore.uz ============
server {
    listen 80;
    listen [::]:80;
    server_name itlivescore.uz www.itlivescore.uz;

    # Slowloris himoyasi: sekin keladigan sarlavha/tana ulanishlarini uzadi
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    # So'rov tanasi hajmi cheklovi (katta yuklamalar bilan to'ldirishga qarshi).
    # 16mb — quiz musiqasi 15MB gacha (multer cheklovi) sig'ishi uchun.
    # Backup restore alohida location da 100mb (faqat admin).
    client_max_body_size 16m;

    # Bir IP dan bir vaqtda 50 tadan ortiq ulanishni rad etamiz
    limit_conn conn 50;

    # HTTP → HTTPS yo'naltirish (certbot qo'shadi)
    # Hozircha HTTP da ishlash uchun quyidagini yoching:

    # Xavfsizlik headerlari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HTTPS yoqilgandan keyin (certbot dan so'ng) quyidagini oching:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # Umumiy sayt: 30r/s, qisqa portlashlarга 60 tagacha yo'l qo'yamiz
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://localhost:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for EMAS, ataylab $remote_addr:
        # birinchisi mehmon yuborgan sarlavhaga QO'SHADI, ya'ni mehmon soxta
        # X-Forwarded-For yuborib Node darajasidagi rate limiterni chetlab
        # o'tishi mumkin edi. $remote_addr esa nginx aniqlagan haqiqiy IP —
        # uni mehmon o'zgartira olmaydi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backup restore — admin butun bazani JSON yuboradi (12mb yetmaydi).
    # Alohida katta limit, lekin bu yo'l roleGuard('admin') bilan himoyalangan.
    location /api/backup/ {
        limit_req zone=api burst=10 nodelay;
        client_max_body_size 100m;
        client_body_timeout 60s;

        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for EMAS, ataylab $remote_addr:
        # birinchisi mehmon yuborgan sarlavhaga QO'SHADI, ya'ni mehmon soxta
        # X-Forwarded-For yuborib Node darajasidagi rate limiterni chetlab
        # o'tishi mumkin edi. $remote_addr esa nginx aniqlagan haqiqiy IP —
        # uni mehmon o'zgartira olmaydi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Login/auth — eng qattiq cheklov (bcrypt qimmat, brute-force nishoni)
    location /api/auth/ {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for EMAS, ataylab $remote_addr:
        # birinchisi mehmon yuborgan sarlavhaga QO'SHADI, ya'ni mehmon soxta
        # X-Forwarded-For yuborib Node darajasidagi rate limiterni chetlab
        # o'tishi mumkin edi. $remote_addr esa nginx aniqlagan haqiqiy IP —
        # uni mehmon o'zgartira olmaydi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API
    location /api/ {
        # 20r/s, portlashlarга 40 tagacha
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for EMAS, ataylab $remote_addr:
        # birinchisi mehmon yuborgan sarlavhaga QO'SHADI, ya'ni mehmon soxta
        # X-Forwarded-For yuborib Node darajasidagi rate limiterni chetlab
        # o'tishi mumkin edi. $remote_addr esa nginx aniqlagan haqiqiy IP —
        # uni mehmon o'zgartira olmaydi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend uploads (rasmlar, musiqa fayllar)
    location /uploads/ {
        proxy_pass http://localhost:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=86400";
    }

    # Socket.IO uchun maxsus sozlash
    location /socket.io/ {
        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}


# ============ DEMO TIZIM — demo.itlivescore.uz ============
server {
    listen 80;
    listen [::]:80;
    server_name demo.itlivescore.uz;

    # Demo banner — brauzer konsolida ko'rinadi
    add_header X-Demo-Environment "true" always;
    add_header X-Powered-By "IT Live Score Demo" always;

    # Xavfsizlik headerlari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://localhost:8051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for EMAS, ataylab $remote_addr:
        # birinchisi mehmon yuborgan sarlavhaga QO'SHADI, ya'ni mehmon soxta
        # X-Forwarded-For yuborib Node darajasidagi rate limiterni chetlab
        # o'tishi mumkin edi. $remote_addr esa nginx aniqlagan haqiqiy IP —
        # uni mehmon o'zgartira olmaydi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://localhost:8051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# ============ SSL — Certbot avtomatik qo'shadi ============
# sudo certbot --nginx -d itlivescore.uz -d www.itlivescore.uz -d demo.itlivescore.uz
# Shundan keyin nginx.conf avtomatik yangilanadi (HTTPS redirect qo'shiladi)
