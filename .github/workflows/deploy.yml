name: 🚀 Deploy to Server

# main branchga push bo'lganda avtomatik ishga tushadi
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Kod o'zgarganligini loglash
      - name: 📋 Show changed files
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🗂️ List changed files
        run: |
          echo "O'zgargan fayllar:"
          git diff --name-only HEAD~1 HEAD || echo "(birinchi commit)"

      # 2. SSH orqali serverga ulanib deploy qilish
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "======================================"
            echo "  Deploy boshlandi: $(date)"
            echo "======================================"

            cd ~/ILS

            # Oxirgi kodni olish
            echo "--> git pull origin main"
            git pull origin main

            # Qoldiq konteynerlarni tozalash.
            # Docker konteynerni qayta yaratganda eskisini vaqtincha
            # "<hash>_<nom>" ga qayta nomlaydi. Agar o'sha jarayon uzilib qolsa,
            # qoldiq konteyner keyingi recreate'ni "name is already in use"
            # xatosi bilan bloklaydi va servis ko'tarilmay qoladi.
            echo "--> Qoldiq konteynerlarni tekshirish..."
            STALE=$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_tizim_' || true)
            if [ -n "$STALE" ]; then
              echo "[!] Qoldiq topildi, o'chirilmoqda: $STALE"
              echo "$STALE" | xargs -r docker rm -f || true
            else
              echo "[OK] Qoldiq yo'q"
            fi

            # O'zgargan fayllarni aniqlash
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
            echo "O'zgargan: $CHANGED"

            BACKEND_CHANGED=false
            FRONTEND_CHANGED=false

            # Backend o'zgardimi?
            if echo "$CHANGED" | grep -qE "^backend/|^all"; then
              BACKEND_CHANGED=true
            fi

            # Frontend o'zgardimi?
            if echo "$CHANGED" | grep -qE "^frontend/|^all"; then
              FRONTEND_CHANGED=true
            fi

            # Backend rebuild
            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo ""
              echo "--> Backend o'zgardi, rebuild qilinmoqda..."

              # Prisma schema yangilanishlarini qo'llash
              echo "--> Prisma db push..."
              docker exec tizim_backend npx prisma db push --schema=prisma/schema.prisma || \
                echo "[WARN] Prisma push ishlamadi (container hali o'zi yangilanadi)"

              docker-compose up -d --build backend
              echo "[OK] Backend yangilandi"
            else
              echo "--> Backend o'zgarmadi, skip."
            fi

            # Frontend rebuild
            if [ "$FRONTEND_CHANGED" = "true" ]; then
              echo ""
              echo "--> Frontend o'zgardi, rebuild qilinmoqda..."
              docker-compose up -d --build frontend
              echo "[OK] Frontend yangilandi"
            else
              echo "--> Frontend o'zgarmadi, skip."
            fi

            # Compose holatini FAQAT docker-compose.yml o'zgarganda moslashtiramiz.
            # Ilgari bu shartsiz ishlardi va backend'ni ikki marta (avval
            # "up -d --build backend", keyin "up -d") qayta yaratishga urinib,
            # qoldiq konteyner nomi to'qnashuvini keltirib chiqardi — natijada
            # backend ko'tarilmay, sayt 502 bergan edi.
            if echo "$CHANGED" | grep -qE "^docker-compose\.yml|^all"; then
              echo ""
              echo "--> docker-compose.yml o'zgardi, konteynerlar moslashtirilmoqda..."
              docker-compose up -d
              echo "[OK] Compose holati qo'llandi"
            fi

            # Har ehtimolga qarshi: konteynerlar tushib qolgan bo'lsa ko'taramiz
            echo ""
            echo "--> Konteynerlar holati tekshirilmoqda..."
            docker-compose up -d --no-recreate
            docker-compose ps

            # Health check
            echo ""
            echo "--> Health check..."
            sleep 10
            curl -sf http://127.0.0.1:5050/api/health && echo "[OK] Backend ishlayapti" || echo "[!] Backend javob bermayapti"

            echo ""
            echo "======================================"
            echo "  Deploy tugadi: $(date)"
            echo "======================================"

            # Ishlaayotgan konteynerlar
            docker ps --format "  -> {{.Names}} | {{.Status}}"
