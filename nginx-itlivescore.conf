# =============================================================================
#  itlivescore.uz — HOST NGINX KONFIGURATSIYASI
#  Haqiqiy joyi: /etc/nginx/conf.d/itlivescore.conf
#
#  DIQQAT: /etc/nginx/sites-available/itlivescore EMAS.
#  O'sha fayl sites-enabled ga ulanmagan va nginx uni hech qachon o'qimaydi.
#  Bu xato tufayli rate limiting kunlar davomida ishlamay turgan edi.
#
#  Topologiya:
#    Cloudflare → host nginx (443) → 127.0.0.1:8050 (frontend konteyner)
#                                  → backend:5000 (konteyner ichida)
#  Ya'ni /api/ ham 8050 orqali o'tadi — frontend konteynerining o'z nginx'i
#  uni backend'ga uzatadi. Shuning uchun bu yerda hamma joy 8050 ga boradi.
# =============================================================================

# ── Rate limit zonalari (http darajasi) ──────────────────────────────────────
# $binary_remote_addr — cloudflare-realip.conf tufayli HAQIQIY mijoz IP si.
# Usiz bu yerda Cloudflare IP si turardi va butun maktab bitta chelakni
# bo'lishib, dars payti ommaviy 429 olardi.
limit_req_zone $binary_remote_addr zone=ils_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ils_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ils_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ils_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# ── Faqat Cloudflare chekkasidan kirishga ruxsat ─────────────────────────────
# Muammo: Cloudflare yoqilgan bo'lsa ham, origin IP (158.220.111.34) bilan
# to'g'ridan-to'g'ri ulanib himoyani butunlay chetlab o'tish mumkin edi.
# Origin IP eski DNS tarixi va sertifikat loglaridan (crt.sh) topiladi.
#
# Nega faraz devor (ufw) EMAS: bu serverda 24 ta boshqa sayt bor va ular
# Cloudflare orqali kelmaydi — 80/443 ni Cloudflare IP'lari bilan chegaralash
# hammasini o'ldirardi. Shuning uchun cheklov FAQAT shu server blokida.
#
# $realip_remote_addr — real_ip moduli $remote_addr ni almashtirishdan
# OLDINGI manzil, ya'ni bizga haqiqatan ulangan tomon (Cloudflare chekkasi).
# $remote_addr ishlatib bo'lmaydi: u allaqachon mijoz IP siga almashtirilgan.
geo $realip_remote_addr $ils_from_cloudflare {
    default 0;

    # O'zimiz (health check, certbot, lokal tekshiruvlar)
    127.0.0.1/32   1;
    ::1/128        1;

    # Cloudflare IPv4 — https://www.cloudflare.com/ips/
    173.245.48.0/20    1;
    103.21.244.0/22    1;
    103.22.200.0/22    1;
    103.31.4.0/22      1;
    141.101.64.0/18    1;
    108.162.192.0/18   1;
    190.93.240.0/20    1;
    188.114.96.0/20    1;
    197.234.240.0/22   1;
    198.41.128.0/17    1;
    162.158.0.0/15     1;
    104.16.0.0/13      1;
    104.24.0.0/14      1;
    172.64.0.0/13      1;
    131.0.72.0/22      1;

    # Cloudflare IPv6
    2400:cb00::/32     1;
    2606:4700::/32     1;
    2803:f800::/32     1;
    2405:b500::/32     1;
    2405:8100::/32     1;
    2a06:98c0::/29     1;
    2c0f:f248::/32     1;
}

server {
    server_name itlivescore.uz www.itlivescore.uz;

    # Cloudflare'dan kelmagan ulanishni rad etamiz.
    # 403 ataylab (444 emas) — muammo bo'lsa logdan darrov ko'rinsin.
    if ($ils_from_cloudflare = 0) {
        return 403;
    }

    # Slowloris himoyasi — sekin sarlavha/tana yuboradigan ulanishlarni uzadi
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;

    # Quiz musiqasi 15MB gacha (multer cheklovi) sig'ishi uchun
    client_max_body_size 16m;

    # Bitta IP dan bir vaqtda ochiladigan ulanishlar
    limit_conn ils_conn 50;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Login — brute-force nishoni, bcrypt qimmat. Eng qattiq cheklov.
    location /api/auth/ {
        limit_req zone=ils_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for EMAS, ataylab $remote_addr:
        # birinchisi mehmon yuborgan sarlavhaga QO'SHADI — ya'ni mehmon soxta
        # X-Forwarded-For yuborib Node darajasidagi rate limiterni chetlab
        # o'tishi mumkin edi. $remote_addr esa nginx aniqlagan haqiqiy IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Backup restore — admin butun bazani JSON yuboradi, 16mb yetmaydi
    location /api/backup/ {
        limit_req zone=ils_api burst=10 nodelay;
        client_max_body_size 100m;
        client_body_timeout 60s;

        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=ils_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO — uzun umrli ulanish, rate limit QO'YILMAYDI.
    # Limit qo'yilsa Live Quiz o'rtasida uzilib qoladi.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=ils_general burst=60 nodelay;

        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/itlivescore.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/itlivescore.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = itlivescore.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name itlivescore.uz www.itlivescore.uz;
    return 404; # managed by Certbot
}
