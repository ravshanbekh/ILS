server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html HECH QACHON keshlanmasin.
    # U qaysi JS fayllar yuklanishini ko'rsatadi; eski nusxa keshda qolsa,
    # foydalanuvchi deploy'dan keyin ham eski (o'chib ketgan) fayllarni
    # so'rayveradi va sahifa qulab tushadi.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Hashli fayllar (assets/*) — nomi mazmuniga bog'liq, shuning uchun mangu
    # keshlanadi. Lekin fayl YO'Q bo'lsa 404 qaytishi SHART: try_files bilan
    # index.html qaytsa, brauzer JS o'rniga HTML oladi va
    # "Failed to fetch dynamically imported module" xatosi chiqadi.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploaded files (quiz music/images, exam images, shop item photos) to backend
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSockets for Socket.io
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
