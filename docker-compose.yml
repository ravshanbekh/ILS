version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tizim_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylda kerak — TUZATISH_REJASI.md 2.2 ga qarang}
      POSTGRES_DB: normativ_tizim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5440:5432" # faqat localhost — tashqi internetdan yopiq
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tizim_backend
    env_file:
      - ./backend/.env
    ports:
      # Faqat localhost — tashqi internetdan yopiq. Trafik faqat nginx orqali
      # (localhost:5050 -> konteyner). Ilgari "5050:5000" (0.0.0.0) edi va
      # hujumchi nginx'ni, TLS'ni va xavfsizlik headerlarini chetlab o'tib
      # to'g'ridan-to'g'ri Node'ga ura olardi.
      - "127.0.0.1:5050:5000"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tizim_frontend
    ports:
      # Faqat localhost — nginx localhost:8050 orqali proxy qiladi
      - "127.0.0.1:8050:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_data:
